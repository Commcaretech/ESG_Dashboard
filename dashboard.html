function section(){const ms=catalog.metrics.filter(m=>m.section===page),groups=[...new Set(ms.map(m=>m.group))];let html=page==='Volunteers'?'<div class="notice">Template scope: non-Tzu Chi volunteers only, or volunteers not captured in VMS.</div>':'';if(editing&&period==='FY'&&ms.some(m=>m.rule!=='annual'))html+='<div class="notice">Select a month to enter monthly figures. Annual-only fields remain editable in the full-year view.</div>';for(const group of groups){html+=`<div class="panel"><h3>${esc(group)}</h3><div class="tablewrap"><table><thead><tr><th>Indicator / unit</th><th>Value</th><th>Data source</th><th>Remarks / coverage</th></tr></thead><tbody>`;for(const m of ms.filter(m=>m.group===group)){const r=stat(m),p=m.rule==='annual'?'FY':period,entry=get(m,p),canEdit=editing&&(m.rule==='annual'||period!=='FY');const source=canEdit?`<input class="source" aria-label="Source" data-id="${m.id}" data-p="${p}" data-field="source" value="${esc(entry.source||'')}" placeholder="Source">`:esc(p==='FY'&&m.rule!=='annual'?'Monthly source records':entry.source||'');const rem=canEdit?`<input class="remark" aria-label="Remarks" data-id="${m.id}" data-p="${p}" data-field="remark" value="${esc(entry.remark||'')}" placeholder="Optional note">`:esc(entry.remark||'');html+=`<tr><td>${esc(m.label)}<br><small>${esc(m.unit)} · ${esc(m.range)}${m.note?'<br>'+esc(m.note):''}</small></td><td>${canEdit?`<input type="number" min="0" step="${['kg','Hours'].includes(m.unit)?'any':'1'}" aria-label="${esc(m.label)}" data-id="${m.id}" data-p="${p}" data-field="value" value="${valid(entry.value)?entry.value:''}" placeholder="Blank">`:fmt(r.value)}</td><td>${source}<br><small>Suggested: ${esc(m.source)}</small></td><td>${rem}<br><small>${r.coverage}/${r.expected} available · ${esc(r.note)}${r.coverage>0&&r.coverage<r.expected?' · Partial':''}</small></td></tr>`}html+='</tbody></table></div></div>'}
for(const rec of catalog.records.filter(r=>r.section===page)){let rows=store.records[rec.id]||[];html+=`<div class="panel"><div class="row"><h3>${esc(rec.label)}</h3>${editing&&rows.length<rec.limit?`<button class="edit-only" data-add="${rec.id}">Add record</button>`:''}</div><small>Annual · Template ${esc(rec.range)}</small>`;if(!rows.length)html+='<p class="muted">No information entered.</p>';rows.forEach((r,i)=>{html+=`<div class="record"><div class="row"><small>Record ${i+1}</small>${editing?`<button data-remove="${rec.id}" data-index="${i}">Remove</button>`:''}</div><div class="recordgrid">${rec.fields.map((f,j)=>`<label>${esc(f)}${editing?`<textarea data-rec="${rec.id}" data-index="${i}" data-col="${j}" placeholder="Leave blank if unavailable">${esc(r[j]||'')}</textarea>`:`<span>${esc(r[j]||'—')}</span>`}</label>`).join('')}</div></div>`});html+='</div>'}$('content').innerHTML=html;document.querySelectorAll('[data-field]').forEach(el=>el.onchange=()=>{const {id,p,field}=el.dataset;if(field==='value'&&el.value!==''&&(!el.checkValidity()||!valid(Number(el.value)))){el.reportValidity();return}store.values[id]??={};store.values[id][p]??={};let entry=store.values[id][p];if(field==='value'){if(el.value==='')delete entry.value;else entry.value=Number(el.value)}else entry[field]=el.value;save()});document.querySelectorAll('[data-add]').forEach(b=>b.onclick=()=>{let r=catalog.records.find(x=>x.id===b.dataset.add);store.records[r.id]??=[];if(store.records[r.id].length<r.limit)store.records[r.id].push(r.fields.map(()=>''));save();render()});document.querySelectorAll('[data-remove]').forEach(b=>b.onclick=()=>{if(confirm('Remove this record?')){store.records[b.dataset.remove].splice(Number(b.dataset.index),1);save();render()}});document.querySelectorAll('[data-rec]').forEach(el=>el.onchange=()=>{let d=el.dataset;store.records[d.rec][Number(d.index)][Number(d.col)]=el.value;save()})}
function download(text,name,type){const a=document.createElement('a');const u=URL.createObjectURL(new Blob([text],{type}));a.href=u;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)}function csvCell(v){let s=String(v??'');if(/^[\s]*[=+@-]/.test(s))s="'"+s;return '"'+s.replace(/"/g,'""')+'"'}function exportCSV(){const rows=[['Section','Indicator','Unit','Period','Value','Source','Remarks','Template reference','Available inputs','Expected inputs']];for(const m of catalog.metrics){for(const p of m.rule==='annual'?['FY']:['FY',...months.map((_,i)=>String(i+1))]){const r=stat(m,p),a=get(m,p);rows.push([m.section,m.label,m.unit,p==='FY'?'FY2026':months[Number(p)-1],r.value,a.source||'',a.remark||'',m.range,r.coverage,r.expected])}}for(const rec of catalog.records){(store.records[rec.id]||[]).forEach((row,i)=>rec.fields.forEach((field,j)=>rows.push([rec.section,rec.label+' / '+field,'Text','FY2026',row[j]||'','','Record '+(i+1),rec.range,'',''])))}download('\uFEFF'+rows.map(r=>r.map(csvCell).join(',')).join('\r\n'),'ESGHub_FY2026.csv','text/csv;charset=utf-8')}
function validateBackup(obj){if(obj?.version!==1||!obj.data?.values||!obj.data?.records)throw Error('Invalid backup format');let clean={values:{},records:{}};for(const [id,entries] of Object.entries(obj.data.values)){const m=catalog.metrics.find(x=>x.id===id);if(!m||!entries||typeof entries!=='object')throw Error('Unknown metric');clean.values[id]={};for(const [p,v] of Object.entries(entries)){if(!(m.rule==='annual'?p==='FY':/^(?:[1-9]|1[012])$/.test(p))||!v||typeof v!=='object')throw Error('Invalid period');if(v.value!==undefined&&(!valid(v.value)||(!['kg','Hours'].includes(m.unit)&&!Number.isInteger(v.value))))throw Error('Invalid number');clean.values[id][p]={};if(v.value!==undefined)clean.values[id][p].value=v.value;for(const f of ['source','remark'])if(typeof v[f]==='string')clean.values[id][p][f]=v[f]}}for(const [id,rows] of Object.entries(obj.data.records)){const r=catalog.records.find(x=>x.id===id);if(!r||!Array.isArray(rows)||rows.length>r.limit||rows.some(x=>!Array.isArray(x)||x.length!==r.fields.length||x.some(y=>typeof y!=='string')))throw Error('Invalid record list');clean.records[id]=rows}return clean}
$('period').innerHTML='<option value="FY">Full year 2026</option>'+months.map((m,i)=>`<option value="${i+1}">${m} 2026</option>`).join('');$('period').onchange=()=>{period=$('period').value;render()};$('edit').onclick=()=>{editing=!editing;if(editing&&page==='Overview')page=catalog.sections[0];render()};$('export').onclick=exportCSV;$('backup').onclick=()=>download(JSON.stringify({version:1,data:store},null,2),'ESGHub_backup.json','application/json');$('restore').onclick=()=>$('file').click();$('file').onchange=async()=>{try{const file=$('file').files[0];if(!file)return;const next=validateBackup(JSON.parse(await file.text()));if(confirm('Replace the current local data with this backup?')){store=next;save();render()}}catch(e){alert('Import failed: '+e.message)}finally{$('file').value=''}};render();
</script></body></html>
